name: security

on:
  # 🔴 Aucun filtre de branche, deliberement, comme lint.yml et tests.yml : une liste de
  # branches se perime, « du code a ete pousse » non. Avec ["main", "master"], la branche de
  # travail n'etait ni auditee ni scannee, et le cron ci-dessous ne court que sur la branche
  # par defaut : un secret ou une dependance vulnerable poussee ailleurs passait sans etre vue.
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"

# Le moins de droits par defaut ; ce qui ecrit est donne au seul job qui en a besoin.
permissions:
  contents: read

jobs:
  supply-chain-and-secrets:
    name: pip-audit + gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks lit `premier^..dernier` des commits du push : dans un clone de profondeur 1 cette
          # plage n'existe pas, le scan lit ~0 octet et l'etape echoue (mesure le 2026-09-30, premier
          # push de 53 commits : « unknown revision »).
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.5"

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.9.0

      - name: Verify lockfile contains sha256 hashes
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path("requirements.lock").read_text(encoding="utf-8").splitlines()
          count = sum(1 for line in lines if "--hash=sha256:" in line)
          if count == 0:
              raise SystemExit("No sha256 hashes found in requirements.lock")
          print(f"Found {count} sha256 hashes in requirements.lock")
          PY

      - name: Dependency vulnerability scan
        run: |
          pip-audit -r requirements.lock --strict

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
