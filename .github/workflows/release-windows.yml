name: release-windows

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify lockfile hashes
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path

          lock = Path("requirements.lock")
          lines = lock.read_text(encoding="utf-8").splitlines()

          offenders = []
          i = 0
          while i < len(lines):
            line = lines[i]
            stripped = line.strip()

            if not stripped or stripped.startswith("#"):
              i += 1
              continue

            if line[0].isspace():
              i += 1
              continue

            if "==" in stripped:
              has_hash = "--hash=sha256:" in stripped
              j = i + 1
              while j < len(lines) and (not lines[j].strip() or lines[j][0].isspace()):
                if "--hash=sha256:" in lines[j]:
                  has_hash = True
                j += 1
              if not has_hash:
                offenders.append(stripped)
              i = j
              continue

            i += 1

          if offenders:
            print("Missing sha256 hashes for:")
            for item in offenders:
              print(f"  - {item}")
            raise SystemExit(1)

          hash_count = sum(1 for line in lines if "--hash=sha256:" in line)
          print(f"Hash validation OK. Found {hash_count} sha256 hash entries.")
          '@
          $tmp = Join-Path $env:RUNNER_TEMP "verify_lock_hashes.py"
          Set-Content -Path $tmp -Value $script -Encoding UTF8
          python $tmp

      - name: Syntax compile check
        run: |
          python -m compileall certus_services.py certus_metrology.py CERTUS_STRAT.py CERTUS_DESIGN.py CERTUS_RE.py

      - name: Unit contracts (seed + services)
        run: |
          python -m pytest tests/unit/test_seed_contract_global.py tests/unit/test_certus_services.py tests/unit/test_release_guardrails.py -q

      - name: Release consistency checks
        run: |
          python tools/release_checks.py

      - name: Generate KPI snapshot
        if: matrix.python-version == '3.11'
        run: |
          python tools/kpi_snapshot.py --write-report

      - name: Generate KPI-5 runtime baseline (best effort)
        if: matrix.python-version == '3.11'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python tools/kpi_snapshot.py --with-kpi5-runtime --write-report

      - name: Smoke release (offscreen)
        shell: pwsh
        run: |
          ./tools/smoke_release.ps1

      - name: Frozen build (spec)
        if: matrix.python-version == '3.11'
        shell: pwsh
        run: |
          ./tools/build_frozen.ps1

      - name: Frozen artifact checks
        if: matrix.python-version == '3.11'
        run: |
          python tools/release_checks.py --check-frozen

      - name: Frozen functional startup check
        if: matrix.python-version == '3.11'
        run: |
          python tools/release_checks.py --check-frozen-run --startup-timeout-sec 12

      - name: Upload frozen artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: certus-hub-frozen-py311
          path: |
            dist/CERTUS_HUB.exe
            build/**

      - name: Upload KPI snapshot artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: certus-kpi-snapshot-py311
          path: |
            reports/KPI_SNAPSHOT_*.md
