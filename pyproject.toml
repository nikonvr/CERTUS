# CERTUS runs from source (CLAUDE.md, section 8). There is no build system: uv installs the
# dependencies, never the project, and `pip install .` is not supported. The Windows
# release is a PyInstaller build (certus_hub.spec).
[project]
name = "certus-optical-suite"
version = "26.05.0"
description = "CERTUS optical thin-film suite (design, strat, RE, index, metal)."
requires-python = ">=3.14.5"
license = "GPL-3.0-only"
authors = [
  { name = "CERTUS Team" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "numpy>=2.4.6,<3.0.0",
  "scipy>=1.17.1",
  "pandas>=3.0.3,<4.0.0",
  "numba>=0.65.1",
  "PyQt6>=6.11.0",
  "pyqtgraph>=0.14.0",
  "matplotlib>=3.10.9",
  "openpyxl>=3.1.5",
  "pydantic>=2.13.4",
  "XlsxWriter>=3.2.9",
  "joblib>=1.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.15.12",
  "hypothesis>=6.0.0",
]
freeze = [
  "pyinstaller>=6.10.0",
]

# -----------------------------------------------------------------------------
# Ruff (lint + format)
# -----------------------------------------------------------------------------
# Full lint select; `extend-ignore` lists the rules that still have violations.
# Never grow it, and never `ruff check --fix`: many "unused" imports are deliberate
# re-exports (CLAUDE.md, section 3). The ratchet tests/oracle/test_lint_debt_ratchet.py
# names the remaining rules: none may enter, and a rule that leaves must leave its list.
[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "PT", "PERF"]
ignore = [
  "E501",  # line-too-long: handled by `line-length = 120`, not enforced strictly
]
# Re-audit by running:  python -m ruff check . --statistics
extend-ignore = [
  # Style legacy
  "E402", "E741",
  # Pyflakes legacy
  "F401",  # unused-import: some are deliberate re-exports
  # Bugbear legacy
  
  # Pyupgrade legacy
  
  "UP040", "UP042", "UP046",
  # Pytest legacy (tests already green — these are stylistic)
  "PT011", "PT017",
  # Performance legacy
  "PERF401",
  # Ruff-specific legacy
  "RUF001", "RUF002", "RUF003", "RUF005",
  "RUF022",
  "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F401", "F811"]  # tests legitimately set up imports lazily
"tools/_*.py" = ["E402"]                    # disposable scripts

[tool.ruff.format]
# `ruff format` is configured but NOT applied: 510 files would change (2026-09-08), and
# no workflow or hook runs it. Reformatting the repository is a decision of its owner.
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers --strict-config --verbose --tb=short --cov=certus --cov-report=html:htmlcov --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "performance: Performance tests",
  "ui: UI tests",
  "e2e: End-to-end tests",
  "slow: Slow running tests",
  "kernels: Tests whose value is the coverage of compiled kernels: the kernel-coverage job runs them with NUMBA_DISABLE_JIT=1",
]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
  "*/tests/*",
  "*/test_*",
  "*/__pycache__/*",
  "*/site-packages/*",
  "build/*",
  "dist/*",
  "CERTUS_DESIGN.py",
  "CERTUS_HUB.py",
  "CERTUS_INDEX.py",
  "CERTUS_INDEX_SPLINE.py",
  "CERTUS_METAL_BILAYER.py",
  "CERTUS_METAL_SINGLE.py",
  "CERTUS_RE.py",
  "CERTUS_STRAT.py",
  "certus_substrate_index.py",
  "scripts/*",
  "tools/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# S4.4 : le verificateur de types parcourt les trois couches du bas. `files` nomme les paquets dont les erreurs comptent ;
# ce qu'ils importent est lu, mais ses erreurs sont tues (`follow_imports = "silent"`). `python -m mypy` depuis la racine.
# Le cliquet des annotations est `tests/architecture_debt.json` (`fonctions_non_annotees`), qui n'a pas besoin de mypy.
[tool.mypy]
python_version = "3.14"
files = ["certus/domain", "certus/physics", "certus/core"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR"
follow_imports = "silent"
# Les bibliotheques sans annotations (scipy en partie, pyqtgraph, openpyxl...) sont lues comme `Any`.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# Numba type ses decorateurs : mypy ne suit ni `prange` ni l'appel d'un Dispatcher (53 erreurs sur 99 au premier passage).
# Ses noyaux sont donc verifies comme du Python ordinaire, et `numba` lui-meme reste opaque.
module = ["numba", "numba.*"]
follow_imports = "skip"
