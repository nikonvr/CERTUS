[package]
name = "certus_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "certus_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "num-complex"] }
numpy = "0.29.0"
ndarray = { version = "0.15.6", features = ["rayon"] }
num-complex = "0.4.5"
rayon = "1.10.0"
