# Dependabot tient a jour les actions que les workflows epinglent par empreinte de commit :
# sans lui, epingler revient a figer des versions que plus personne ne relit. Les dependances
# Python ne sont pas ici : la CI eprouve volontairement les dernieres versions a chaque run
# (docs/ETAT.md, section 3, Logiciel) et le verrou est remonte par son proprietaire.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
