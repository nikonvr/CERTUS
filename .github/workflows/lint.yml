name: lint

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  ruff:
    name: ruff (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff==0.15.12

      - name: Ruff check
        run: ruff check .

      - name: Ruff format (check)
        run: ruff format --check .

      - name: Dead symbol audit (CI)
        if: matrix.python-version == '3.11'
        run: python tools/dead_symbol_audit.py --ci --whitelist tools/dead_symbol_whitelist.txt

      - name: Lambda-connect audit (baseline=0)
        if: matrix.python-version == '3.11'
        run: python tools/lambda_connect_audit.py --ci --max-count 0
