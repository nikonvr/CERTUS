name: tests

# La suite complète de CLAUDE.md, section 2, à chaque push.
#
# 🔴 AUCUN TEST N'EST EXCLU. Les étapes découpent la suite pour rendre un échec
# attribuable, elles n'en retirent aucun : si un job devient trop long, on sépare les
# jobs. Ne recopie ici ni compte de tests ni durée : ils se périmaient en un mois.

on:
  pull_request:
  # Aucun filtre de branche : une liste de branches se périme, « du code a été poussé »
  # non. Une liste périmée a déjà laissé passer des commits sans vérification.
  push:

# Le moins de droits : aucun de ces jobs n'ecrit dans le depot.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (ubuntu, py${{ matrix.python-version }})
    # Tout sauf l'interface, sous Linux avec PyQt6 en offscreen ; l'interface a son job
    # Windows, plus bas. Si ce job expire, on le sépare, on ne relève pas le plafond.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    env:
      # PyQt6 sans serveur X. À poser AVANT toute création de QApplication ;
      # tests/conftest.py le fait aussi par sécurité.
      QT_QPA_PLATFORM: offscreen
      # Sort le cache Numba de l'arborescence source, comme configure_numba_env()
      # le fait dans l'application.
      NUMBA_CACHE_DIR: /tmp/certus_numba_cache

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Bibliothèques système requises par PyQt6
        # Sans elles, PyQt6 ne s'importe pas, même en offscreen : le plugin de
        # plateforme est lié à EGL et à xkbcommon.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx0 libgles2 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libx11-xcb1

      - name: Installer uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Dépendances
        # 🔴 LES DERNIÈRES VERSIONS STABLES, À CHAQUE RUN (docs/ETAT.md, section 3,
        # Logiciel) : `--upgrade` ré-résout au-delà de `uv.lock`, qui n'est qu'un point de
        # départ. Une CI rouge peut donc venir d'une version publiée le jour même, et c'est
        # voulu ; `uv pip list` journalise ce qui a été éprouvé. CERTUS s'utilise en source,
        # sans système de construction : on installe les dépendances, jamais le projet.
        # `--upgrade` réécrit `uv.lock` : on rend ensuite celui du dépôt, que les tests
        # comparent à `requirements.lock` (test_requirements_lock_follows_uv_lock).
        run: |
          uv sync --upgrade --no-install-project --extra dev --python ${{ matrix.python-version }}
          uv pip list
          git checkout -- uv.lock

      - name: Vérifier que certus est importé depuis le dépôt
        # Un install éditable a déjà fait résoudre `certus` vers une AUTRE copie du disque :
        # les correctifs restaient invisibles aux tests.
        run: |
          source .venv/bin/activate
          python -c "import certus.physics.certus_opt_tmm as m; print(m.__file__)"
          python -c "import certus.physics.certus_opt_tmm as m, pathlib, sys; sys.exit(0 if pathlib.Path(m.__file__).is_relative_to(pathlib.Path.cwd()) else 1)"

      - name: Oracle TMM
        # D'abord : la référence TMM indépendante. S'il tombe, le reste n'a pas d'intérêt.
        run: |
          source .venv/bin/activate
          python -m pytest tests/oracle/ -q --no-cov

      - name: Tests unitaires
        # La partie qui attrape le plus, pour le moins cher.
        run: |
          source .venv/bin/activate
          python -m pytest tests/unit/ -q --no-cov

      - name: Le reste de tests/
        # Tout ce qui n'est ni oracle, ni unit, ni ui : integration, headless,
        # regression, performance. Rien n'est exclu.
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --no-cov --ignore=tests/oracle --ignore=tests/unit --ignore=tests/ui

  interface:
    name: interface (windows, py3.14)
    # 🔴 L'INTERFACE SE MESURE SUR WINDOWS : l'audit d'ergonomie mesure des largeurs en
    # pixels avec Segoe UI, la police de la machine cible, et refuse de tourner sans
    # elle. Sous Linux, le 2026-09-26 : 69 échecs et 12 erreurs, tous dus à la police
    # absente ou à des sous-processus sans plateforme Qt.
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache numba hors de l'arborescence source
        # Posé par une étape : le contexte `runner` n'existe pas dans l'`env` d'un job.
        run: echo "NUMBA_CACHE_DIR=$RUNNER_TEMP/certus_numba_cache" >> "$GITHUB_ENV"

      - name: Installer uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Python 3.14
        run: uv python install 3.14

      - name: Dépendances
        # Les dernières versions stables, comme le job Linux — voir son commentaire.
        run: |
          uv sync --upgrade --no-install-project --extra dev --python 3.14
          uv pip list
          git checkout -- uv.lock

      - name: Vérifier que certus est importé depuis le dépôt
        run: |
          source .venv/Scripts/activate
          python -c "import certus.physics.certus_opt_tmm as m, pathlib, sys; print(m.__file__); sys.exit(0 if pathlib.Path(m.__file__).is_relative_to(pathlib.Path.cwd()) else 1)"

      - name: Interface
        # D'un seul tenant : tests/ui/conftest.py détruit les fenêtres principales que
        # chaque test construit (D11 de docs/ETAT.md).
        run: |
          source .venv/Scripts/activate
          python -m pytest tests/ui/ -q --no-cov
