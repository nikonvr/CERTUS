[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certus-optical-suite"
version = "26.05.0"
description = "CERTUS optical thin-film suite (design, strat, RE, index, metal)."
readme = "README.md"
requires-python = ">=3.14.5"
license = { text = "Proprietary" }
authors = [
  { name = "CERTUS Team" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "numpy>=2.4.6,<3.0.0",
  "scipy>=1.17.1",
  "pandas>=3.0.3,<4.0.0",
  "numba>=0.65.1",
  "PyQt6>=6.11.0",
  "pyqtgraph>=0.14.0",
  "matplotlib>=3.10.9",
  "openpyxl>=3.1.5",
  "pydantic>=2.14.0a1",
  "XlsxWriter>=3.2.9",
  "joblib>=1.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.15.12",
  "pre-commit>=4.0.0",
  "hypothesis>=6.0.0",
]
freeze = [
  "pyinstaller>=6.10.0",
]

[tool.setuptools]
packages = ["certus"]

# -----------------------------------------------------------------------------
# Ruff (lint + format) — Foundation action #2 of CERTUS_MASTER_TODO_OPTIMIZATION
# -----------------------------------------------------------------------------
# Target: Python 3.14+ (aligned with requires-python >= 3.14.5).
# Initial baseline (2026-04-26): full lint select with `extend-ignore` of every
# rule that currently has live violations across the codebase. Each ignored rule
# below maps to a planned cleanup batch; remove the entry once the batch lands.
# DO NOT use `ruff check --fix` blindly on legacy code — surface diffs in PR.
[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
  "tools/build_certus_pages.py",  # broken f-string template, see #2 follow-up note
  "build",
  "dist",
  ".venv",
  "*.egg-info",
  "OLD VERSION",
  # Legacy UTF-16 scratch snapshots (untracked, not part of the package). Kept
  # on disk for manual reference; excluded from lint since they are not UTF-8.
  "old_physics_impl.py",
  "old_ui.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "PT", "PERF"]
ignore = [
  "E501",  # line-too-long: handled by `line-length = 120`, not enforced strictly
]
# Existing-violations whitelist. Linked actions in master TODO drive the cleanup.
# Re-audit by running:  python -m ruff check . --statistics
extend-ignore = [
  # Style legacy (low priority, batch later via #34 collateral)
  "E401", "E402", "E701", "E702", "E713", "E731", "E741",
  # Pyflakes legacy
  "F401",  # unused-import — Batch F of #56 (depends on this action)
  "F403", "F405",  # wildcard imports — #15 will eradicate
  "F541",  # f-string-missing-placeholders
  "F601",  # multi-value-repeated-key-literal
  "F811",  # redefined-while-unused
  "F821", "F822",  # undefined-name (mostly false positives from delayed imports)
  "F841",  # unused-variable
  # Isort
  "I001",  # unsorted-imports — `ruff format` will handle later
  # Bugbear legacy
  "B007", "B008", "B009", "B010", "B011", "B017", "B018", "B019",
  "B023", "B025", "B033", "B904", "B905",
  # Pyupgrade legacy (modernization sweep tracked separately)
  "UP006", "UP007", "UP008", "UP009", "UP015", "UP018",
  "UP024", "UP031", "UP032", "UP034", "UP035", "UP036", "UP037",
  "UP040", "UP042", "UP045", "UP046",
  # Pytest legacy (tests already green — these are stylistic)
  "PT006", "PT007", "PT011", "PT015", "PT017", "PT018", "PT019",
  # Performance legacy
  "PERF102", "PERF401", "PERF403",
  # Ruff-specific legacy
  "RUF001", "RUF002", "RUF003", "RUF005", "RUF010", "RUF012",
  "RUF013", "RUF015", "RUF019", "RUF022", "RUF023", "RUF034",
  "RUF043", "RUF046", "RUF059", "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F401", "F811"]  # tests legitimately set up imports lazily
"tools/_*.py" = ["E402"]                    # disposable scripts

[tool.ruff.format]
# `ruff format` is configured but NOT auto-applied yet. The pre-commit hook in
# .pre-commit-config.yaml runs `ruff-format --check` only — surface diffs to
# review. Switch to autofix in a dedicated PR once the team confirms the spec.
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers --strict-config --verbose --tb=short --cov=certus --cov-report=html:htmlcov --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "performance: Performance tests",
  "ui: UI tests",
  "e2e: End-to-end tests",
  "slow: Slow running tests",
  "gpu: Tests requiring GPU",
  "network: Tests requiring network",
]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
  "*/tests/*",
  "*/test_*",
  "*/__pycache__/*",
  "*/site-packages/*",
  "build/*",
  "dist/*",
  "setup.py",
  "CERTUS_DESIGN.py",
  "CERTUS_HUB.py",
  "CERTUS_INDEX.py",
  "CERTUS_INDEX_SPLINE.py",
  "CERTUS_METAL_BILAYER.py",
  "CERTUS_METAL_SINGLE.py",
  "CERTUS_RE.py",
  "CERTUS_STRAT.py",
  "certus_plot.py",
  "certus_re_helpers.py",
  "certus_substrate_index.py",
  "spline_profile_corridors.py",
  "scripts/*",
  "tools/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.14"
warn_return_any = false
warn_unused_configs = true
# Require type hints for all new code
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "build/",
    "dist/",
    "tests/",
    "tools/",
    "scripts/"
]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*",
    "pandas.*",
    "pyqtgraph.*",
    "matplotlib.*",
    "openpyxl.*",
    "PyQt6.*",
    "numba.*"
]
ignore_missing_imports = true
