name: tests

# Ce workflow existe parce que la suite ne tournait NULLE PART en intégration
# continue : lint.yml n'exécute aucun test, release-windows.yml en exécute trois
# fichiers.
#
# 🔴 AUCUN TEST N'EST EXCLU, et c'est la règle. Les étapes ci-dessous découpent la
# suite pour rendre un échec ATTRIBUABLE et pour isoler un fichier pathologique —
# elles n'en retirent aucun. Si le job devient trop long, la réponse est de séparer
# les JOBS, ou d'employer les marqueurs `slow` et `performance` déjà déclarés dans
# pyproject.toml ; exclure au hasard ne l'est pas.
#
# ⚠️ Ne recopie aucun compte de tests ici. Ce commentaire a porté « 2746 tests » et
# « 6 min 27 pour la suite complète », mesurés le 2026-08-02 — les deux étaient
# largement dépassés au 2026-09-08, et le second avait rendu le budget du job
# insuffisant sans que personne ne le voie.

on:
  pull_request:
  # 🔴 AUCUN FILTRE DE BRANCHE — voir le commentaire de lint.yml. La liste
  # `main` + `refactor-corridors-mixins` s'etait perimee : mesure le 2026-09-08,
  # le travail se fait sur une branche absente de la liste, donc AUCUN commit
  # n'etait verifie. Une liste se perime, une propriete non.
  push:

jobs:
  pytest:
    name: pytest (ubuntu, py${{ matrix.python-version }})
    # ubuntu-latest pour tout ce qui ne mesure pas l'interface : plus rapide, PyQt6
    # tournant en mode offscreen. L'interface a son propre job Windows, plus bas.
    runs-on: ubuntu-latest
    # 🔴 30 MIN NE SUFFISAIENT PLUS. Le commentaire d'en-tete annonce « 6 min 27 pour
    # la suite complete », mesure le 2026-08-02 -- avant que la suite ne grossisse de
    # plusieurs centaines de tests, dont toute la campagne d'ergonomie. 📏 Localement
    # le 2026-09-08, `tests/ui/` seule depasse 50 min sur un i5-8250U Windows ; ubuntu
    # en offscreen est plus rapide, mais l'ecart au budget etait deja structurel.
    # 60 min laisse une marge sans etre illimite ; si le job expire, la reponse est de
    # SEPARER les jobs, pas de relever encore.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    env:
      # PyQt6 sans serveur X. À poser AVANT toute création de QApplication ;
      # tests/conftest.py le fait aussi par sécurité.
      QT_QPA_PLATFORM: offscreen
      # Sort le cache Numba de l'arborescence source, comme configure_numba_env()
      # le fait dans l'application.
      NUMBA_CACHE_DIR: /tmp/certus_numba_cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bibliothèques système requises par PyQt6
        # Liste issue de la recette validée (CLAUDE.md §4). Sans elles, l'import de
        # PyQt6 échoue même en offscreen — le plugin de plateforme est lié à EGL et
        # xkbcommon.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx0 libgles2 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libx11-xcb1

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Dépendances
        # Le projet est utilisable en mode source uniquement : seul certus/domain a
        # un __init__.py, les sept autres sous-paquets sont en PEP 420 et
        # pyproject déclare packages = ["certus"] (CLAUDE.md §2). On installe donc
        # les dépendances SANS installer le projet.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install \
            "numpy>=2.4.6,<3.0.0" "scipy>=1.17.1" "pandas>=3.0.3,<4.0.0" \
            "numba>=0.65.1" "PyQt6>=6.11.0" "pyqtgraph>=0.14.0" \
            "matplotlib>=3.10.9" "openpyxl>=3.1.5" "pydantic>=2.14.0a1" \
            "XlsxWriter>=3.2.9" "joblib>=1.5.3" \
            "pytest>=8.0.0" "pytest-cov>=5.0.0" "hypothesis>=6.0.0"

      - name: Vérifier que certus est importé depuis le dépôt
        # Garde-fou : un jour, un install éditable résolvait `certus` vers un AUTRE
        # snapshot du disque, et les correctifs restaient invisibles (CLAUDE.md §5.5).
        # Deux lignes ici évitent de valider le mauvais code pendant des mois.
        run: |
          source .venv/bin/activate
          python -c "import certus.physics.certus_opt_tmm as m; print(m.__file__)"
          python -c "import certus.physics.certus_opt_tmm as m, pathlib, sys; sys.exit(0 if pathlib.Path(m.__file__).is_relative_to(pathlib.Path.cwd()) else 1)"

      - name: Oracle TMM
        # Lancé d'abord et séparément : c'est la référence indépendante qui valide
        # la physique (CLAUDE.md §7). S'il tombe, le reste n'a pas d'intérêt.
        run: |
          source .venv/bin/activate
          python -m pytest tests/oracle/ -q --no-cov

      - name: Tests unitaires
        # Separe de l'interface : 2 456 tests en 2 min 58 localement le 2026-09-08.
        # C'est la moitie qui attrape le plus, pour le moins cher.
        run: |
          source .venv/bin/activate
          python -m pytest tests/unit/ -q --no-cov

      - name: Le reste de tests/
        # Tout ce qui n'est ni oracle, ni unit, ni ui : integration, headless,
        # regression, performance. Rien n'est exclu.
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --no-cov --ignore=tests/oracle --ignore=tests/unit --ignore=tests/ui

  interface:
    name: interface (windows, py3.14)
    # 🔴 L'INTERFACE SE MESURE SUR WINDOWS, et ce n'est pas une preference. L'audit
    # d'ergonomie mesure des largeurs en pixels avec Segoe UI, la police de la machine
    # cible ; il REFUSE de tourner sans elle (« every width would be measured on a
    # machine that does not exist »). 📏 Le 2026-09-26 sous Linux : 69 echecs et 12
    # erreurs sur ~800 tests d'interface, tous dus a la police absente ou a des
    # sous-processus sans plateforme Qt -- aucun a un defaut du code. Separer le job
    # applique la regle de l'en-tete : on separe, on n'exclut rien.
    runs-on: windows-latest
    # Localement 31 min (Ryzen 7 5700G, 2026-09-26) ; un runner est plus lent.
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache numba hors de l'arborescence source
        # Pose par une etape : le contexte `runner` n'existe pas dans l'`env` d'un job
        # (le premier essai, 2026-09-26, a rendu un workflow invalide en 0 s).
        run: echo "NUMBA_CACHE_DIR=$RUNNER_TEMP/certus_numba_cache" >> "$GITHUB_ENV"

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Python 3.14
        run: uv python install 3.14

      - name: Dépendances
        run: |
          uv venv --python 3.14
          uv pip install \
            "numpy>=2.4.6,<3.0.0" "scipy>=1.17.1" "pandas>=3.0.3,<4.0.0" \
            "numba>=0.65.1" "PyQt6>=6.11.0" "pyqtgraph>=0.14.0" \
            "matplotlib>=3.10.9" "openpyxl>=3.1.5" "pydantic>=2.14.0a1" \
            "XlsxWriter>=3.2.9" "joblib>=1.5.3" \
            "pytest>=8.0.0" "pytest-cov>=5.0.0" "hypothesis>=6.0.0"

      - name: Vérifier que certus est importé depuis le dépôt
        run: |
          source .venv/Scripts/activate
          python -c "import certus.physics.certus_opt_tmm as m, pathlib, sys; print(m.__file__); sys.exit(0 if pathlib.Path(m.__file__).is_relative_to(pathlib.Path.cwd()) else 1)"

      - name: Interface
        # 🔴 `test_ux_re_stop_when_idle` est ECARTE ici et lance seul juste apres :
        # ~9 min PAR TEST dans la suite complete contre quelques secondes isole
        # (fenetres jamais detruites, defaut D11 de docs/ETAT.md).
        run: |
          source .venv/Scripts/activate
          python -m pytest tests/ui/ -q --no-cov --deselect tests/ui/test_ux_re_stop_when_idle.py

      - name: Interface — le fichier pathologique, seul
        run: |
          source .venv/Scripts/activate
          python -m pytest tests/ui/test_ux_re_stop_when_idle.py -q --no-cov
