[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certus-optical-suite"
version = "26.01.0"
description = "CERTUS optical thin-film suite (design, strat, RE, index, metal)."
readme = "README.md"
requires-python = ">=3.14.5"
license = { text = "Proprietary" }
authors = [
  { name = "CERTUS Team" }
]
dependencies = [
  "numpy>=1.26.4,<2.4",
  "scipy>=1.15.0",
  "pandas>=2.2.3,<3.0.0",
  "numba>=0.63.1",
  "PyQt6>=6.10.2",
  "pyqtgraph>=0.14.0",
  "matplotlib>=3.9.0",
  "openpyxl>=3.1.5",
  "pydantic>=2.11.0",
  "XlsxWriter>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.15.12",
  "pre-commit>=4.0.0",
]
freeze = [
  "pyinstaller>=6.10.0",
]

[tool.setuptools]
py-modules = [
  "_build_html_report",
  "_certus_physics_impl",
  "certus_a11y",
  "certus_animations",
  "certus_badges",
  "certus_command_palette",
  "certus_core",
  "certus_curve_smoother",
  "certus_data",
  "certus_design_worker_utils",
  "certus_design_workers_dto",
  "CERTUS_DESIGN",
  "certus_empty_state",
  "certus_errors",
  "certus_export",
  "CERTUS_HUB",
  "certus_icons",
  "certus_index_spline_core",
  "CERTUS_INDEX_SPLINE",
  "certus_index_utils",
  "CERTUS_INDEX",
  "certus_live_visualizer",
  "certus_load_summary",
  "certus_measurement_excel_ui",
  "CERTUS_METAL_BILAYER",
  "certus_metal_common",
  "CERTUS_METAL_SINGLE",
  "certus_metrology",
  "certus_onboarding",
  "certus_plot",
  "certus_progress_tracker",
  "certus_qt_widgets",
  "certus_re_helpers",
  "certus_re_results_builder",
  "certus_re_worker_utils",
  "certus_re_workers",
  "CERTUS_RE",
  "certus_recent_strip",
  "certus_recent",
  "certus_reports",
  "certus_reset_framework",
  "certus_sample_data",
  "certus_services",
  "certus_shortcuts_overlay",
  "certus_skeleton",
  "certus_smart_init_curve_editor",
  "certus_spectral_preproc",
  "certus_spectral_workers",
  "certus_spectrum_eval_ui",
  "certus_strat_context",
  "certus_strat_db",
  "certus_strat_service",
  "certus_strat_workers_dto",
  "CERTUS_STRAT",
  "certus_substrate_index",
  "certus_svg",
  "certus_toast_stack",
  "certus_tooltips",
  "certus_tours_catalog",
  "certus_ui",
  "certus_ux",
  "spline_corridor_log_coaching",
  "spline_finalize",
  "spline_objective",
  "spline_pipeline",
  "spline_presets",
  "spline_profile_corridors",
  "spline_smart_init",
  "spline_visual_utils",
  "spline_workers",
]

# -----------------------------------------------------------------------------
# Ruff (lint + format) — Foundation action #2 of CERTUS_MASTER_TODO_OPTIMIZATION
# -----------------------------------------------------------------------------
# Target: Python 3.14+ (aligned with requires-python >= 3.14.5).
# Initial baseline (2026-04-26): full lint select with `extend-ignore` of every
# rule that currently has live violations across the codebase. Each ignored rule
# below maps to a planned cleanup batch; remove the entry once the batch lands.
# DO NOT use `ruff check --fix` blindly on legacy code — surface diffs in PR.
[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
  "tools/build_certus_pages.py",  # broken f-string template, see #2 follow-up note
  "build",
  "dist",
  ".venv",
  "*.egg-info",
  "OLD VERSION",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "PT", "PERF"]
ignore = [
  "E501",  # line-too-long: handled by `line-length = 120`, not enforced strictly
]
# Existing-violations whitelist. Linked actions in master TODO drive the cleanup.
# Re-audit by running:  python -m ruff check . --statistics
extend-ignore = [
  # Style legacy (low priority, batch later via #34 collateral)
  "E401", "E402", "E701", "E702", "E713", "E731", "E741",
  # Pyflakes legacy
  "F401",  # unused-import — Batch F of #56 (depends on this action)
  "F403", "F405",  # wildcard imports — #15 will eradicate
  "F541",  # f-string-missing-placeholders
  "F601",  # multi-value-repeated-key-literal
  "F811",  # redefined-while-unused
  "F821", "F822",  # undefined-name (mostly false positives from delayed imports)
  "F841",  # unused-variable
  # Isort
  "I001",  # unsorted-imports — `ruff format` will handle later
  # Bugbear legacy
  "B007", "B008", "B009", "B010", "B011", "B017", "B018", "B019",
  "B023", "B025", "B033", "B904", "B905",
  # Pyupgrade legacy (modernization sweep tracked separately)
  "UP006", "UP007", "UP008", "UP009", "UP015", "UP018",
  "UP024", "UP031", "UP032", "UP034", "UP035", "UP036", "UP037",
  "UP040", "UP042", "UP045", "UP046",
  # Pytest legacy (tests already green — these are stylistic)
  "PT006", "PT007", "PT011", "PT015", "PT017", "PT018", "PT019",
  # Performance legacy
  "PERF102", "PERF401", "PERF403",
  # Ruff-specific legacy
  "RUF001", "RUF002", "RUF003", "RUF005", "RUF010", "RUF012",
  "RUF013", "RUF015", "RUF019", "RUF022", "RUF023", "RUF034",
  "RUF043", "RUF046", "RUF059", "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F401", "F811"]  # tests legitimately set up imports lazily
"tools/_*.py" = ["E402"]                    # disposable scripts

[tool.ruff.format]
# `ruff format` is configured but NOT auto-applied yet. The pre-commit hook in
# .pre-commit-config.yaml runs `ruff-format --check` only — surface diffs to
# review. Switch to autofix in a dedicated PR once the team confirms the spec.
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers --strict-config --verbose --tb=short --cov=certus_core --cov=certus_errors --cov=certus_ui --cov=certus_data --cov=certus_reset_framework --cov=certus_metrology --cov=spline_objective --cov=spline_presets --cov=certus_spectral_preproc --cov-report=html:htmlcov --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "performance: Performance tests",
  "ui: UI tests",
  "e2e: End-to-end tests",
  "slow: Slow running tests",
  "gpu: Tests requiring GPU",
  "network: Tests requiring network",
]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
  "*/tests/*",
  "*/test_*",
  "*/__pycache__/*",
  "*/site-packages/*",
  "build/*",
  "dist/*",
  "setup.py",
  "CERTUS_DESIGN.py",
  "CERTUS_HUB.py",
  "CERTUS_INDEX.py",
  "CERTUS_INDEX_SPLINE.py",
  "CERTUS_METAL_BILAYER.py",
  "CERTUS_METAL_SINGLE.py",
  "CERTUS_RE.py",
  "CERTUS_STRAT.py",
  "certus_plot.py",
  "certus_re_helpers.py",
  "certus_substrate_index.py",
  "spline_pipeline.py",
  "spline_profile_corridors.py",
  "spline_workers.py",
  "_certus_physics_impl.py",
  "scripts/*",
  "tools/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
