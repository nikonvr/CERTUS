name: release-windows

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

# Le moins de droits : aucun de ces jobs n'ecrit dans le depot.
permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.14.5" ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Confirm Python release target
        run: |
          python -c "import sys; print(sys.version)"

      - name: Verify lockfile hashes
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path

          lock = Path("requirements.lock")
          lines = lock.read_text(encoding="utf-8").splitlines()

          offenders = []
          i = 0
          while i < len(lines):
            line = lines[i]
            stripped = line.strip()

            if not stripped or stripped.startswith("#"):
              i += 1
              continue

            if line[0].isspace():
              i += 1
              continue

            if "==" in stripped:
              has_hash = "--hash=sha256:" in stripped
              j = i + 1
              while j < len(lines) and (not lines[j].strip() or lines[j][0].isspace()):
                if "--hash=sha256:" in lines[j]:
                  has_hash = True
                j += 1
              if not has_hash:
                offenders.append(stripped)
              i = j
              continue

            i += 1

          if offenders:
            print("Missing sha256 hashes for:")
            for item in offenders:
              print(f"  - {item}")
            raise SystemExit(1)

          hash_count = sum(1 for line in lines if "--hash=sha256:" in line)
          print(f"Hash validation OK. Found {hash_count} sha256 hash entries.")
          '@
          $tmp = Join-Path $env:RUNNER_TEMP "verify_lock_hashes.py"
          Set-Content -Path $tmp -Value $script -Encoding UTF8
          python $tmp

      - name: Syntax compile check
        # compileall exits 0 on a missing file: the entry points are globbed, and none found fails.
        run: |
          python -m compileall -q certus
          python -c "import compileall, glob, sys; files = sorted(glob.glob('CERTUS_*.py')); sys.exit(0 if files and all(compileall.compile_file(f, quiet=1) for f in files) else 1)"

      - name: Full test suite (oracle + unit including release guardrails)
        run: |
          python -m pytest tests/oracle/ tests/unit/ tests/unit/test_seed_contract_global.py tests/unit/test_certus_services.py tests/unit/test_release_guardrails.py -q --no-cov

      - name: Release consistency checks
        run: |
          python tools/release_checks.py

      - name: Smoke release (offscreen)
        shell: pwsh
        run: |
          ./tools/smoke_release.ps1

      - name: Frozen build (spec)
        if: matrix.python-version == '3.14.5'
        shell: pwsh
        run: |
          ./tools/build_frozen.ps1

      - name: Frozen artifact checks
        if: matrix.python-version == '3.14.5'
        run: |
          python tools/release_checks.py --check-frozen

      - name: Frozen functional startup check
        if: matrix.python-version == '3.14.5'
        run: |
          python tools/release_checks.py --check-frozen-run --startup-timeout-sec 12

      - name: Upload frozen artifact
        if: matrix.python-version == '3.14.5'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certus-hub-frozen-py314
          path: |
            dist/CERTUS_HUB/**
            build/certus_hub/warn-certus_hub.txt

      - name: Upload frozen diagnostics
        if: always() && matrix.python-version == '3.14.5'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certus-frozen-diagnostics-py314
          if-no-files-found: ignore
          path: |
            dist/CERTUS_HUB/logs/**
            dist/CERTUS_HUB/*.log
            build/certus_hub/warn-certus_hub.txt
