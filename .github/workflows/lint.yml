name: lint

on:
  pull_request:
  # 🔴 Aucun filtre de branche, deliberement : une liste de branches se perime (elle a
  # deja laisse passer une journee de commits), la propriete « du code a ete pousse »
  # non.
  push:

jobs:
  ruff:
    name: ruff (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ruff
        # La derniere version, comme les dependances du workflow `tests` (docs/ETAT.md,
        # section 3, Logiciel) ; `ruff --version` journalise ce qui a ete eprouve.
        run: |
          python -m pip install --upgrade pip ruff
          ruff --version

      - name: Ruff check
        run: ruff check .

      # Pas de `ruff format --check .` : `ruff format` n'est pas applique au depot
      # (510 fichiers non conformes le 2026-09-08, voir [tool.ruff.format] dans
      # pyproject.toml), et un job rouge en permanence n'est pas un garde-fou. A
      # retablir le jour ou le depot est reformate, decision de son proprietaire.

      - name: Dead symbol audit (CI)
        if: matrix.python-version == '3.14.5'
        run: python tools/dead_symbol_audit.py --ci --whitelist tools/dead_symbol_whitelist.txt

      - name: Lambda-connect audit (baseline=0)
        if: matrix.python-version == '3.14.5'
        run: python tools/lambda_connect_audit.py --ci --max-count 0
