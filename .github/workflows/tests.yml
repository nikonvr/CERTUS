name: tests

# La suite compte 2746 tests et ne tournait NULLE PART en intégration continue.
# lint.yml n'exécute aucun test ; release-windows.yml en exécute 3 fichiers sur 226.
# Aucun des 150+ commits de la branche de travail n'avait donc été validé.
#
# Durée mesurée localement le 2026-08-02 : 6 min 27 pour la suite complète. C'est
# assez rapide pour tout exécuter — aucun test n'est exclu, ni par marqueur ni
# autrement. Si cela devait changer, les marqueurs `slow` et `performance` sont
# déjà déclarés dans pyproject.toml et sont le bon levier ; exclure au hasard ne
# l'est pas.

on:
  pull_request:
  push:
    branches:
      - main
      - refactor-corridors-mixins

jobs:
  pytest:
    name: pytest (ubuntu, py${{ matrix.python-version }})
    # ubuntu-latest et non windows-latest : la recette Linux est validée
    # (CLAUDE.md §4) et bien plus rapide, PyQt6 tournant en mode offscreen.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    env:
      # PyQt6 sans serveur X. À poser AVANT toute création de QApplication ;
      # tests/conftest.py le fait aussi par sécurité.
      QT_QPA_PLATFORM: offscreen
      # Sort le cache Numba de l'arborescence source, comme configure_numba_env()
      # le fait dans l'application.
      NUMBA_CACHE_DIR: /tmp/certus_numba_cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bibliothèques système requises par PyQt6
        # Liste issue de la recette validée (CLAUDE.md §4). Sans elles, l'import de
        # PyQt6 échoue même en offscreen — le plugin de plateforme est lié à EGL et
        # xkbcommon.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx0 libgles2 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libx11-xcb1

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Dépendances
        # Le projet est utilisable en mode source uniquement : seul certus/domain a
        # un __init__.py, les sept autres sous-paquets sont en PEP 420 et
        # pyproject déclare packages = ["certus"] (CLAUDE.md §2). On installe donc
        # les dépendances SANS installer le projet.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install \
            "numpy>=2.4.6,<3.0.0" "scipy>=1.17.1" "pandas>=3.0.3,<4.0.0" \
            "numba>=0.65.1" "PyQt6>=6.11.0" "pyqtgraph>=0.14.0" \
            "matplotlib>=3.10.9" "openpyxl>=3.1.5" "pydantic>=2.14.0a1" \
            "XlsxWriter>=3.2.9" "joblib>=1.5.3" \
            "pytest>=8.0.0" "pytest-cov>=5.0.0" "hypothesis>=6.0.0"

      - name: Vérifier que certus est importé depuis le dépôt
        # Garde-fou : un jour, un install éditable résolvait `certus` vers un AUTRE
        # snapshot du disque, et les correctifs restaient invisibles (CLAUDE.md §5.5).
        # Deux lignes ici évitent de valider le mauvais code pendant des mois.
        run: |
          source .venv/bin/activate
          python -c "import certus.physics.certus_opt_tmm as m; print(m.__file__)"
          python -c "import certus.physics.certus_opt_tmm as m, pathlib, sys; sys.exit(0 if pathlib.Path(m.__file__).is_relative_to(pathlib.Path.cwd()) else 1)"

      - name: Oracle TMM
        # Lancé d'abord et séparément : c'est la référence indépendante qui valide
        # la physique (CLAUDE.md §7). S'il tombe, le reste n'a pas d'intérêt.
        run: |
          source .venv/bin/activate
          python -m pytest tests/oracle/ -q --no-cov

      - name: Suite complète
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --no-cov
